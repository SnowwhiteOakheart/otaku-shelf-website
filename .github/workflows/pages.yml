name: Website auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  schedule:
    # Aktualisiert die Neuheiten viermal täglich aus Supabase.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: PHP einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl
          coverage: none

      - name: PHP-Generator prüfen
        run: php -l build/neuheiten.php

      - name: Statische Website bauen
        run: |
          mkdir -p _site
          cp -a public/. _site/
          php build/neuheiten.php > _site/neuheiten.html
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/neuheiten.html

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v6

      - name: Website-Artefakt hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # v5 laesst Punkt-Dateien sonst weg (.nojekyll, kuenftig z.B. .well-known/).
          include-hidden-files: true

  # Eigener Job: deploy-pages direkt nach dem Upload im selben Job fand das
  # Artefakt sporadisch noch nicht ("Found 0 artifact(s)"), weil die
  # Artefakt-API den Upload erst verzögert listet. Die Job-Grenze garantiert,
  # dass das Artefakt registriert ist.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
